<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>决策看板 · 球在谁手里</title>
<style>
:root{
  --bg:#FAFAFA; --card:#FFFFFF; --ink:#09090B; --ink2:#3F3F46; --ink3:#71717A;
  --line:#E4E4E7; --accent:#2563EB; --accent-soft:#EFF6FF;
  --warn:#B45309; --warn-bg:#FEF3C7; --late:#B91C1C; --late-bg:#FEE2E2;
  --ok:#15803D; --ok-bg:#DCFCE7; --soft:#F4F4F5;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
button,textarea{font:inherit}
button{cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 80px}
header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
header h1{font-size:21px;margin:0}
header .sub{color:var(--ink3);font-size:13px}
header .spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 14px;color:var(--ink2);text-decoration:none;display:inline-block;line-height:1.4}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.confirm{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{padding:2px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.btn.void{color:var(--ink3);border-style:dashed}
.btn.void:hover{color:var(--late);border-color:var(--late)}

/* dashboard */
.dash{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;margin-bottom:22px}
.dash table{width:100%;border-collapse:collapse}
.dash th,.dash td{padding:8px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.dash th:first-child,.dash td:first-child{text-align:left;white-space:normal}
.dash thead th{font-size:12px;color:var(--ink3);font-weight:600;background:var(--soft)}
.dash tbody tr:last-child td{border-bottom:none}
.dash tfoot td{font-weight:700;background:var(--soft);border-bottom:none}
.dash .dname{color:var(--ink3);font-size:12px;margin-left:6px}
.num{font-variant-numeric:tabular-nums}
.num.me{color:var(--late);font-weight:700}
.num.zero{color:#C4C4CC;font-weight:400}

/* sections + cards */
section{margin-bottom:26px}
section h2{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px}
section h2 .cnt{font-size:12px;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:1px 9px;font-weight:600}
.empty{color:var(--ink3);font-size:13px;padding:6px 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:12px 14px;margin-bottom:10px}
.card h3{font-size:15px;margin:0;line-height:1.4;word-break:break-word}
.card h3 .code{font-size:12px;font-weight:500;color:var(--ink3);margin-left:6px}
.age{font-size:12px;color:var(--ink3);margin-left:6px;font-weight:500}
.age.stale{color:var(--late);font-weight:600}
.blk{margin-top:8px;display:grid;grid-template-columns:72px 1fr;gap:2px 10px;font-size:14px}
.blk>.k{color:var(--ink3);font-size:12px;padding-top:2px}
.blk>.v{min-width:0;word-break:break-word}
.muted{color:var(--ink3)}
.todo{background:var(--warn-bg);border-radius:6px;padding:4px 8px;color:#713F12;font-weight:600}
.stage{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:5px;padding:0 6px;margin-right:6px;color:var(--ink2);background:var(--soft)}
.wl{margin:2px 0 0;padding:0;list-style:none}
.wl li{font-size:13px;color:var(--ink2)}
.wl li b{font-weight:600;color:var(--ink)}
.ev{margin:0;padding:0;list-style:none;font-size:13px}
.ev li{color:var(--ink2);padding:1px 0}
.ev .ts{color:var(--ink3);font-variant-numeric:tabular-nums;margin-right:6px;white-space:nowrap}
details.more summary{cursor:pointer;color:var(--accent);font-size:12px;margin-top:2px}
.mail{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.tag{font-size:11px;border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--ink3);white-space:nowrap}
.tag.qt{border-color:#93C5FD;color:#1D4ED8;background:#EFF6FF}
.tag.tt{border-color:#FCD34D;color:#92400E;background:#FFFBEB}
.tag.dr{border-color:#FCA5A5;color:#991B1B;background:#FEF2F2}
code.q{font:13px/1.4 Consolas,"Courier New",monospace;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:3px 8px;word-break:break-all;max-width:100%}
.links{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:flex-end}
.act.left{justify-content:flex-start}
textarea{width:100%;min-height:64px;margin-top:10px;border:1px solid var(--line);border-radius:8px;padding:8px;resize:vertical}
textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.answered .ans{color:var(--ok);font-weight:600}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.show{opacity:.92}
#toast.err{background:var(--late)}
@media (max-width:600px){
  .wrap{padding:14px 10px 60px}
  .dash th,.dash td{padding:7px 8px}
  .dash .dname{display:block;margin-left:0}
  .blk{grid-template-columns:1fr}
  .blk>.k{padding-top:6px}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>决策看板</h1>
    <span class="sub" id="sub">加载中…</span>
    <span class="spacer"></span>
    <a class="btn" href="/">项目看板</a>
  </header>

  <div class="dash" id="dash"></div>

  <section>
    <h2>待你审的草稿 <span class="cnt" id="n_drafts">0</span></h2>
    <div id="drafts"></div>
  </section>
  <section>
    <h2>待你决定 <span class="cnt" id="n_choices">0</span></h2>
    <div id="choices"></div>
  </section>
  <section>
    <h2>待你给意见 <span class="cnt" id="n_texts">0</span></h2>
    <div id="texts"></div>
  </section>
  <section>
    <h2>其他轮到你 <span class="cnt" id="n_other">0</span></h2>
    <div id="other"></div>
  </section>
  <section id="answeredSec" hidden>
    <h2>已答复、等转交 <span class="cnt" id="n_answered">0</span></h2>
    <div id="answered"></div>
  </section>
</div>
<div id="toast"></div>

<script>
let S = null;
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const FOLDER_CN = {inbox:"收件箱", drafts:"草稿箱", sent:"已发送"};
const SHOW_EVENTS = 4;

function toast(msg, err){
  const t = $("toast"); t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "", 2600);
}

async function load(){
  try{
    const r = await fetch("/api/boss", {cache:"no-store"});
    S = await r.json(); render();
  }catch(e){ toast("读取失败: " + e, true); }
}

async function post(action, args, okMsg){
  try{
    const r = await fetch("/api", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({action, args, view:"boss"})});
    const j = await r.json();
    if(!r.ok){ toast(j.error || "失败", true); return false; }
    S = j; render(); toast(okMsg); return true;
  }catch(e){ toast("提交失败: " + e, true); return false; }
}

async function copyText(text){
  try{ await navigator.clipboard.writeText(text); }
  catch(_){  // 非安全上下文的兜底
    const t = document.createElement("textarea"); t.value = text; document.body.appendChild(t);
    t.select(); document.execCommand("copy"); t.remove();
  }
}

/* ---------- 卡片 ---------- */
function ageTag(age){
  if(age === undefined || age === null) return "";
  return `<span class="age ${age >= S.stale_days ? "stale" : ""}">${age} 天</span>`;
}

function stepBlock(p, selfId){
  const ws = p.waits.map(w => `<li>${w.id === selfId ? "▶ " : ""}<b>${esc(w.party_cn)}${w.who ? "(" + esc(w.who) + ")" : ""}</b>：${esc(w.what)} <span class="muted">· ${w.age} 天</span></li>`).join("");
  return `${p.stage ? `<span class="stage">${esc(p.stage)}</span>` : ""}${ws ? `<ul class="wl">${ws}</ul>` : `<span class="muted">没有未完成的等待项</span>`}`;
}

function eventsBlock(p){
  const li = e => `<li><span class="ts">${esc(e.ts)}</span>${esc(e.text)}</li>`;
  const ev = p.events || [];
  if(!ev.length) return `<span class="muted">暂无</span>`;
  const head = ev.slice(0, SHOW_EVENTS).map(li).join("");
  const rest = ev.slice(SHOW_EVENTS);
  return `<ul class="ev">${head}</ul>` + (rest.length
    ? `<details class="more"><summary>展开全部 ${ev.length} 条</summary><ul class="ev">${rest.map(li).join("")}</ul></details>` : "");
}

function mailBlock(w){
  if(!w || !w.search) return "";
  const box = (w.mailbox || "").toLowerCase();
  const folder = w.mail_folder;
  return `<div class="k">邮件</div><div class="v"><div class="mail">
      ${box ? `<span class="tag ${box === "qt" ? "qt" : box === "tt" ? "tt" : ""}">${esc(box.toUpperCase())}</span>` : ""}
      ${folder ? `<span class="tag ${folder === "drafts" ? "dr" : ""}">${esc(FOLDER_CN[folder] || folder)}</span>` : ""}
      <code class="q">${esc(w.search)}</code>
      <button class="btn sm" data-copy="${esc(w.search)}">复制</button>
    </div>
    ${w.mail_to ? `<div class="muted" style="font-size:13px;margin-top:3px">收件人：${esc(w.mail_to)}</div>` : ""}
  </div>`;
}

function linksBlock(p){
  const ls = (p.links || []).map(r => `<a href="${esc(r.target)}" target="_blank" rel="noopener">${esc(r.label || "链接")}</a>`);
  if(p.session) ls.push(`<a href="${esc(p.session)}">打开项目 session</a>`);
  return ls.length ? `<div class="k">链接</div><div class="v links">${ls.join("")}</div>` : "";
}

function card({p, todo, age, wait, actions, extra}){
  const titleTxt = [p.dept, p.title || p.code].filter(Boolean).join(" · ");
  return `<div class="card">
    <h3>${esc(titleTxt)}<span class="code">${esc(p.code)}</span>${ageTag(age)}</h3>
    <div class="blk">
      <div class="k">背景</div><div class="v">${p.brief ? esc(p.brief) : `<span class="muted">（还没写背景）</span>`}</div>
      <div class="k">进展</div><div class="v">${eventsBlock(p)}</div>
      <div class="k">现在</div><div class="v">${stepBlock(p, wait && wait.id)}</div>
      <div class="k">要你做</div><div class="v"><span class="todo">${esc(todo)}</span></div>
      ${mailBlock(wait)}
      ${linksBlock(p)}
    </div>
    ${extra || ""}
    ${actions ? `<div class="act">${actions}</div>` : ""}
  </div>`;
}

function n(v, cls){ return `<td class="num ${v ? cls||"" : "zero"}">${v}</td>`; }

function render(){
  $("sub").textContent = `更新于 ${S.now} · 每 60 秒自动刷新`;
  const tot = {me:0, internal:0, external:0};
  const rows = S.stats.map(s => {
    tot.me += s.me; tot.internal += s.internal; tot.external += s.external;
    return `<tr><td><b>${esc(s.code || "—")}</b><span class="dname">${esc(s.name)}</span></td>
      ${n(s.me,"me")}${n(s.internal)}${n(s.external)}</tr>`;
  }).join("");
  $("dash").innerHTML = `<table>
    <thead><tr><th>部门</th><th>轮到${S.owner === "我" ? "我" : " " + esc(S.owner)}</th><th>内部在做</th><th>等外部</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr><td>合计</td>${n(tot.me,"me")}${n(tot.internal)}${n(tot.external)}</tr></tfoot></table>`;

  // 保留展开状态和正在输入的意见
  const open = new Set([...document.querySelectorAll("details.more[open]")].map(d => d.closest(".card")?.dataset.key));
  const typed = {};
  document.querySelectorAll("textarea[data-tid]").forEach(t => typed[t.dataset.tid] = t.value);

  $("n_drafts").textContent = S.drafts.length;
  $("drafts").innerHTML = S.drafts.map(w => card({p:w.project, todo:w.what, age:w.age, wait:w,
      actions:`<button class="btn primary" data-sent="${w.id}">已发</button>`})).join("")
    || `<div class="empty">没有待审草稿</div>`;

  $("n_choices").textContent = S.choices.length;
  $("choices").innerHTML = S.choices.map(d => card({p:d.project, todo:d.question,
      actions: `<button class="btn sm void" data-void="${d.id}" title="不再需要答复（已在别处定 / 不跟了）">作废</button><span style="flex:1"></span>` + (d.kind === "ack"
        ? `<button class="btn ok" data-ans="${d.id}" data-val="">知道了</button>`
        : d.options.map(o => `<button class="btn" data-ans="${d.id}" data-val="${esc(o)}">${esc(o)}</button>`).join(""))
    })).join("") || `<div class="empty">没有待决定事项</div>`;

  $("n_texts").textContent = S.texts.length;
  $("texts").innerHTML = S.texts.map(d => card({p:d.project, todo:d.question,
      extra:`<textarea data-tid="${d.id}" placeholder="写下你的意见…">${esc(typed[d.id] || "")}</textarea>`,
      actions:`<button class="btn sm void" data-void="${d.id}" title="不再需要答复（已在别处定 / 不跟了）">作废</button><span style="flex:1"></span><button class="btn primary" data-txt="${d.id}">提交</button>`})).join("")
    || `<div class="empty">没有待给意见的事项</div>`;

  $("n_other").textContent = S.other_me.length;
  $("other").innerHTML = S.other_me.map(w => card({p:w.project, todo:w.what, age:w.age, wait:w})).join("")
    || `<div class="empty">没有其他轮到你的事</div>`;

  $("answeredSec").hidden = !S.answered.length;
  $("n_answered").textContent = S.answered.length;
  $("answered").innerHTML = S.answered.map(d => `
    <div class="card answered"><h3>${esc([d.project.dept, d.project.title || d.code].filter(Boolean).join(" · "))}<span class="code">${esc(d.code)}</span></h3>
      <div style="margin-top:6px">${esc(d.question)} → <span class="ans">${esc(d.answer)}</span>
      <span class="muted" style="font-size:12px">（答于 ${esc(d.answered_at)}）</span></div></div>`).join("");

  // 卡片 key 用于恢复「展开全部」
  document.querySelectorAll(".card").forEach(c => {
    c.dataset.key = c.querySelector(".code")?.textContent + "|" + (c.querySelector(".todo")?.textContent || "");
    if(open.has(c.dataset.key)) c.querySelectorAll("details.more").forEach(d => d.open = true);
  });
}

document.addEventListener("click", async e => {
  const b = e.target.closest("button"); if(!b || b.disabled) return;
  if(b.dataset.copy !== undefined){
    await copyText(b.dataset.copy);
    b.textContent = "已复制"; setTimeout(() => { if(b.isConnected) b.textContent = "复制"; }, 1500);
    toast("已复制，去 Outlook 搜索框粘贴");
  } else if(b.dataset.sent){
    // 两步确认：第一次点变成「确认已发？」，3 秒内再点才执行
    if(!b.classList.contains("confirm")){
      b.classList.add("confirm"); b.textContent = "确认已发？";
      setTimeout(() => { if(b.isConnected){ b.classList.remove("confirm"); b.textContent = "已发"; } }, 3000);
      return;
    }
    b.disabled = true;
    await post("sent", {id: +b.dataset.sent}, "已标记发出") || (b.disabled = false);
  } else if(b.dataset.void){
    if(!b.classList.contains("confirm")){
      b.classList.add("confirm"); b.textContent = "确认作废？";
      setTimeout(() => { if(b.isConnected){ b.classList.remove("confirm"); b.textContent = "作废"; } }, 3000);
      return;
    }
    b.disabled = true;
    await post("void", {id: +b.dataset.void, reason: "Qiushi 在 /boss 作废"}, "已作废") || (b.disabled = false);
  } else if(b.dataset.ans){
    b.disabled = true;
    await post("answer", {id: +b.dataset.ans, answer: b.dataset.val}, "已记录: " + (b.dataset.val || "知道了")) || (b.disabled = false);
  } else if(b.dataset.txt){
    const t = document.querySelector(`textarea[data-tid="${b.dataset.txt}"]`);
    if(!t.value.trim()){ toast("先写点什么", true); t.focus(); return; }
    b.disabled = true;
    await post("answer", {id: +b.dataset.txt, answer: t.value}, "意见已提交") || (b.disabled = false);
  }
});

// 每 60 秒刷新；正在打字时跳过这一轮
setInterval(() => {
  const a = document.activeElement;
  if(a && a.tagName === "TEXTAREA" && a.value) return;
  load();
}, 60000);
load();
</script>
</body>
</html>
